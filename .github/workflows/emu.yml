name: emu

on:
  push:
    branches: [main]
    paths:
      - 'emu/**'
      - 'test_carts/**'
      - '.github/workflows/emu.yml'
  pull_request:
    paths:
      - 'emu/**'
      - 'test_carts/**'
      - '.github/workflows/emu.yml'

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emu

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Lint
        run: bun run lint
