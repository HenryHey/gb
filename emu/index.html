<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>emu</title>
  </head>

  <body>
    <div class="rom-bar">
      <label for="rom">Load a ROM</label>
      <input type="file" id="rom" accept=".gb,.gbc,.bin" />
      <label class="control-label">
        <input type="checkbox" id="debug-ui" checked />
        Debugging
      </label>
    </div>
    <pre id="info"></pre>
    <div class="controls">
      <button type="button" id="reset">Reset</button>
      <button type="button" id="play">Play</button>
      <span class="controls-debug">
        <button type="button" id="step">Step</button>
        <button type="button" id="frame">Step Frame</button>
      </span>
    </div>
    <div class="row">
      <div class="screen-col">
        <canvas id="screen" width="160" height="144"></canvas>
        <pre id="debug"></pre>
      </div>
      <div class="debug-col">
        <pre id="regs"></pre>
        <details class="debug-section" open>
          <summary>Code</summary>
          <pre id="code"></pre>
        </details>
        <details class="debug-section" open>
          <summary>VRAM tiles ($8000–$97FF)</summary>
          <canvas id="vram" width="128" height="192"></canvas>
        </details>
      </div>
    </div>
    <footer class="footer">
      <a href="/opcodes.html">Opcode table</a>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
