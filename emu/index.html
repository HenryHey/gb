<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>emu</title>
  </head>

  <body>
    <p><a href="/opcodes.html">Opcode table</a></p>
    <label for="rom">Load a ROM</label>
    <input type="file" id="rom" accept=".gb,.gbc,.bin" />
    <label for="bytes">Or paste bytes</label>
    <textarea
      id="bytes"
      rows="3"
      placeholder="[0x3e, 0x01, 0x06, 0x02, 0x04, 0x18, 0xfe]"
    ></textarea>
    <button type="button" id="load-bytes">Load bytes</button>
    <pre id="info"></pre>
    <div class="row">
      <div class="screen-col">
        <canvas id="screen" width="160" height="144"></canvas>
        <pre id="debug"></pre>
      </div>
      <div class="debug-col">
        <div class="controls">
          <button type="button" id="reset">Reset</button>
          <button type="button" id="step">Step</button>
          <button type="button" id="frame">Run 70224 T-cycles</button>
        </div>
        <pre id="regs"></pre>
        <pre id="code"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
